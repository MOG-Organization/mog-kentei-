<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOGホワ鯖検定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EFF3; --paper:#F7FBFD; --ink:#1B2A41; --steel:#5C7185; --frost:#B9D2DE;
  --ember:#F08A24; --ember-deep:#C4561A; --ok:#2E7D5B; --ng:#B23A3A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A26; --paper:#172636; --ink:#E4EEF4; --steel:#94A8BA; --frost:#2C4256;
    --ember:#F59A3C; --ember-deep:#F2B872; --ok:#5DC495; --ng:#EE7B7B;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A26; --paper:#172636; --ink:#E4EEF4; --steel:#94A8BA; --frost:#2C4256;
  --ember:#F59A3C; --ember-deep:#F2B872; --ok:#5DC495; --ng:#EE7B7B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  font-weight:500; line-height:1.7;
}
.wrap{max-width:620px; margin:0 auto; padding:28px 18px 48px}
h1{
  font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif; font-weight:400;
  font-size:clamp(2.6rem,11vw,4.2rem); line-height:1.05; margin:0; letter-spacing:.02em;
}
.lead{color:var(--steel); margin:10px 0 22px}

/* 温度計：正解するほど大溶鉱炉が温まる */
.thermo{display:flex; align-items:center; gap:12px; margin-bottom:22px}
.bar{flex:1; height:14px; border-radius:7px; background:var(--frost); overflow:hidden}
.fill{height:100%; width:0; background:linear-gradient(90deg,var(--ember),var(--ember-deep)); transition:width .5s ease}
.temp{font-family:"Dela Gothic One",sans-serif; font-size:1.1rem; min-width:4.5em; text-align:right}

.card{background:var(--paper); border:2px solid var(--frost); border-radius:18px; padding:22px 20px}
.qno{color:var(--steel); font-size:.95rem; margin:0 0 6px}
.qtext{font-size:1.25rem; font-weight:700; margin:0 0 18px; line-height:1.55}
.choices{display:grid; gap:10px}
.choice{
  font:inherit; font-weight:700; text-align:left; color:var(--ink);
  background:transparent; border:2px solid var(--frost); border-radius:12px;
  padding:13px 15px; cursor:pointer;
}
.choice:hover:not(:disabled){border-color:var(--ember)}
.choice:focus-visible,.btn:focus-visible{outline:3px solid var(--ember); outline-offset:2px}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok); color:var(--ok)}
.choice.wrong{border-color:var(--ng); color:var(--ng)}
.feedback{margin-top:16px; display:none}
.feedback.show{display:block}
.verdict{font-weight:700; margin:0 0 4px}
.verdict.r{color:var(--ok)} .verdict.w{color:var(--ng)} .verdict.o{color:var(--ember-deep)}
.choice.picked{border-color:var(--ember); color:var(--ember-deep)}
.explain{margin:0; color:var(--ink)}
.src{margin:6px 0 0; font-size:.85rem; color:var(--steel)}
.btn{
  font:inherit; font-weight:700; margin-top:18px; width:100%;
  background:var(--ink); color:var(--paper); border:none; border-radius:12px; padding:14px; cursor:pointer;
}

/* 認定証 */
.cert{text-align:center; padding:30px 22px; border:3px double var(--ember); border-radius:18px; background:var(--paper)}
.cert .stamp{font-family:"Dela Gothic One",sans-serif; color:var(--ember-deep); font-size:1rem; margin:0}
.cert .rank{font-family:"Dela Gothic One",sans-serif; font-weight:400; font-size:clamp(1.7rem,7vw,2.4rem); line-height:1.25; margin:12px 0}
.cert .score{font-size:1.1rem; margin:0 0 14px}
.cert .comment{text-align:left; margin:0 0 10px}
.meta{text-align:left; margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 14px}
.meta dt{color:var(--steel)} .meta dd{margin:0; font-weight:700}
.share{margin-top:16px; font-size:.9rem; color:var(--steel); text-align:center; min-height:1.4em}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>

  <div class="thermo" aria-hidden="true">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="temp" id="temp">-40℃</div>
  </div>

  <main id="stage"></main>
</div>

let idx=0, score=0, jokes=0, wrongs=0, picks={};
const TOTAL=10, OPEN_COUNT=3;
let QUESTIONS=[], QUIZ_COUNT=0;
const stage=document.getElementById("stage");
const fill=document.getElementById("fill");
const temp=document.getElementById("temp");

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[a[i],a[k]]=[a[k],a[i]];}return a;}
function draw(){
  const quiz=shuffle(POOL.filter(q=>!q.open)).slice(0,TOTAL-OPEN_COUNT);
  const open=shuffle(POOL.filter(q=>q.open)).slice(0,OPEN_COUNT);
  QUESTIONS=shuffle(quiz.concat(open));
  QUIZ_COUNT=quiz.length;
}
function heat(){
  const pct=QUIZ_COUNT?score/QUIZ_COUNT*100:0;
  fill.style.width=pct+"%";
  temp.textContent=Math.round(-40+(QUIZ_COUNT?score/QUIZ_COUNT:0)*60)+"℃";
}

function renderQuestion(){
  const Q=QUESTIONS[idx];
  const opts = Q.open ? shuffle(Q.opts) : shuffle([{t:Q.a,k:"a"},{t:Q.w,k:"w"},{t:Q.j,k:"j"}]);
  stage.innerHTML=`
    <section class="card" aria-live="polite">
      <p class="qno">第${idx+1}問 / ${QUESTIONS.length}</p>
      <p class="qtext">${Q.q}</p>
      <div class="choices">${opts.map((o,i)=>`<button class="choice" data-k="${o.k}" data-i="${i}">${o.t}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>
    </section>`;
  stage.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>Q.open?answerOpen(b,opts):answer(b)));
}

function showNext(fb,html){
  fb.innerHTML=html+`<button class="btn" id="next">${idx<QUESTIONS.length-1?"次の問題へ":"診断を見る"}</button>`;
  fb.classList.add("show");
  const next=document.getElementById("next");
  next.focus();
  next.addEventListener("click",()=>{idx++; idx<QUESTIONS.length?renderQuestion():renderResult();});
}

function answerOpen(btn,opts){
  const o=opts[+btn.dataset.i];
  picks[o.k]=(picks[o.k]||0)+1;
  stage.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  btn.classList.add("picked");
  showNext(document.getElementById("fb"),
    `<p class="verdict o">実はこの問題、正解はありません！</p><p class="explain">${o.res}</p><p class="src">あなたの答えは診断に使われます。</p>`);
}

function answer(btn){
  const Q=QUESTIONS[idx], k=btn.dataset.k;
  stage.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    if(b.dataset.k==="a") b.classList.add("right");
  });
  if(k==="a"){score++;} else {btn.classList.add("wrong"); if(k==="j") jokes++; else wrongs++;}
  heat();
  const verdict = k==="a" ? `<p class="verdict r">正解！大溶鉱炉が少し温まった。</p>`
    : k==="j" ? `<p class="verdict w">ボケてる場合じゃない！</p>`
    : `<p class="verdict w">惜しい、ハズレ。</p>`;
  showNext(document.getElementById("fb"),
    `${verdict}<p class="explain">${Q.ex}</p><p class="src">出典：${Q.src}</p>`);
}

function judgeBase(score,jokes,wrongs){
  const r=score/QUIZ_COUNT;
  if(jokes>=3) return TYPES.mood;
  if(r>=0.8) return jokes===0 ? TYPES.sanbou : TYPES.meishu;
  if(r>=0.5) return jokes>=2 ? TYPES.meishu : TYPES.genba;
  if(wrongs>=jokes) return TYPES.totsugeki;
  return TYPES.mypace;
}

function judge(){
  const base=judgeBase(score,jokes,wrongs);
  const pts={};
  for(const key in TYPES) pts[key]=(picks[key]||0);
  const baseKey=Object.keys(TYPES).find(k=>TYPES[k]===base);
  pts[baseKey]+=2;
  let best=baseKey;
  for(const key in pts) if(pts[key]>pts[best]) best=key;
  return TYPES[best];
}

function renderResult(){
  const T=judge();
  const shareText=`MOGホワ鯖検定の結果：${score}/${QUIZ_COUNT}問正解、あなたは「${T.name}」`;
  stage.innerHTML=`
    <section class="cert" aria-live="polite">
      <p class="stamp">あなたの領主タイプは</p>
      <p class="rank">${T.name}</p>
      <p class="score">${score} / ${QUIZ_COUNT} 問正解（ネタ選択 ${jokes} 回）</p>
      <p class="comment">${T.desc}</p>
      <dl class="meta">
        <dt>向いている役割</dt><dd>${T.role}</dd>
        <dt>相性のいいタイプ</dt><dd>${T.aisyou}</dd>
      </dl>
      <button class="btn" id="copy">結果をコピー</button>
      <button class="btn" id="retry">もう一度挑戦する</button>
      <p class="share" id="share"></p>
    </section>`;
  document.getElementById("retry").addEventListener("click",start);
  document.getElementById("copy").addEventListener("click",async()=>{
    const s=document.getElementById("share");
    try{await navigator.clipboard.writeText(shareText); s.textContent="コピーしました。同盟チャットに貼れます。";}
    catch(e){s.textContent=shareText;}
  });
}

function start(){draw();idx=0;score=0;jokes=0;wrongs=0;picks={};heat();renderQuestion();}
start();
</script>
</body>
</html>
